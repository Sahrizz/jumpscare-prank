<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Important Message</title>
  <style>
    body {
      background: #f5f5f5;
      color: #222;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 70px 15px;
    }

    button {
      padding: 14px 24px;
      font-size: 18px;
      cursor: pointer;
    }

    #surprise {
      display: none;
      margin-top: 25px;
    }

    #surprise img {
      max-width: 100%;
      width: 350px;
    }
  </style>
</head>
<body>
  <h2>You have an important message!</h2>
  <p>Tap the button below to reveal it.</p>
  <button onclick="reveal()">Open message</button>

  <div id="surprise">
    <h1>BOO!</h1>
    <p>HAHAHAHA YOU GOT PRANKED!</p>
    <img
      src="https://placehold.co/600x400/111111/ffffff?text=BOO!"
      alt="Surprise message">
  </div>

  <script>
    function reveal() {
      document.getElementById("surprise").style.display = "block";
    }
  </script>
</body>
</html>
