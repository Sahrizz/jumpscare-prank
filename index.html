
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Reminder</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f4f4f4;
    color: #222;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  #start {
    padding: 28px;
  }

  button {
    padding: 15px 24px;
    border: 0;
    border-radius: 8px;
    background: #222;
    color: white;
    font-size: 18px;
  }

  #scare {
    display: none;
    position: fixed;
    inset: 0;
    background: #080000;
    color: white;
    place-items: center;
    align-content: center;
    gap: 18px;
    padding: 20px;
  }

  #face {
    font-size: min(65vw, 330px);
    line-height: 1;
    animation: shake .12s infinite;
  }

  #scare h1 {
    font-size: clamp(28px, 8vw, 54px);
    color: #ff2222;
  }

  #stop {
    background: #444;
  }

  @keyframes shake {
    0% { transform: translate(2px, 1px); }
    50% { transform: translate(-2px, -2px); }
    100% { transform: translate(1px, 2px); }
  }
</style>
</head>

<body>
  <main id="start">
    <h2>Your daily reminder</h2>
    <p>Tap below to read today's message.</p>
    <button id="open">Open message</button>
  </main>

  <section id="scare">
    <div id="face">👹</div>
    <h1>BOOOOO!</h1>
    <button id="stop">Stop sound</button>
  </section>

<script>
  const start = document.getElementById("start");
  const scare = document.getElementById("scare");
  let voice;

  document.getElementById("open").addEventListener("click", () => {
    start.style.display = "none";
    scare.style.display = "grid";

    if ("speechSynthesis" in window) {
      speechSynthesis.cancel();
      voice = new SpeechSynthesisUtterance("Boooo!");
      voice.rate = 0.75;
      voice.pitch = 0.5;
      voice.volume = 0.7;
      speechSynthesis.speak(voice);
    }
  });

  document.getElementById("stop").addEventListener("click", () => {
    if ("speechSynthesis" in window) {
      speechSynthesis.cancel();
    }
    scare.style.display = "none";
    start.style.display = "block";
  });
</script>
</body>
</html>
